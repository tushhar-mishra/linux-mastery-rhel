name: docs-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links, anchors and code fences
        run: python3 tools/check_notes.py
      - name: Roadmap is up to date and every note is scheduled
        run: python3 tools/build_roadmap.py --check
      - name: Grader scripts parse
        run: for f in notes/rhcsa-exam-labs/graders/*.sh; do bash -n "$f"; done
